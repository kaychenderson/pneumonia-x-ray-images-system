services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pneumoai
      POSTGRES_USER: pneumoai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque-esta-senha}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pneumoai"]
      interval: 5s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://pneumoai:${POSTGRES_PASSWORD:-troque-esta-senha}@db:5432/pneumoai
      MEDIA_ROOT: /data/media
      MODEL_PATH: /models/modelDenseNet121_Pneumonia.keras
      DJANGO_SECURE_SSL_REDIRECT: "False"   # TLS termina no proxy reverso; ajuste em produção
    volumes:
      - media:/data/media
      - ./ml_models:/models:ro
    ports:
      - "8000:8000"

volumes:
  pgdata:
  media:
